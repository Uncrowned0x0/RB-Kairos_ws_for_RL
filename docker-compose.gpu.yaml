name: kairos_ws_rl

services:
  kairos_rl:
    extends:
      file: docker-compose.yaml
      service: kairos_rl
    # NVIDIA GPU override for hardware acceleration (Gazebo Harmonic & PyTorch CUDA)
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      WORKSPACE_DIR: /home/robot/ros2_ws
      SRC_DIR: /home/robot/ros2_ws/src
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      __EGL_VENDOR_LIBRARY_FILENAMES: "/usr/share/glvnd/egl_vendor.d/10_nvidia.json"
