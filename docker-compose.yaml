name: kairos_ws_rl

services:
  kairos_rl:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: robot
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    image: kairos_rl:jazzy
    container_name: kairos_rl_sim
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      WORKSPACE_DIR: /home/robot/ros2_ws
      SRC_DIR: /home/robot/ros2_ws/src
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      __EGL_VENDOR_LIBRARY_FILENAMES: "/usr/share/glvnd/egl_vendor.d/10_nvidia.json"
    network_mode: host
    ipc: host
    shm_size: 8gb
    privileged: true
    stdin_open: true
    tty: true
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Sources mounted via bind-mount from host
      - ./src:/home/robot/ros2_ws/src
      # Workspace management script and compose config
      - ./kairos_rl.sh:/home/robot/ros2_ws/kairos_rl.sh:ro
      - ./docker-compose.yaml:/home/robot/ros2_ws/docker-compose.yaml:ro
      - ./kairos_teleop_keyboard.py:/home/robot/ros2_ws/kairos_teleop_keyboard.py:ro
      # Checkpoints and RL logs mounted for persistent host storage
      - ./checkpoints:/home/robot/ros2_ws/checkpoints
      - ./rl_level0:/home/robot/ros2_ws/rl_level0
      - ./tb_logs:/home/robot/ros2_ws/tb_logs
      # Persistent named volumes for ROS 2 build and log artifacts
      - kairos_rl_build:/home/robot/ros2_ws/build
      - kairos_rl_install:/home/robot/ros2_ws/install
      - kairos_rl_log:/home/robot/ros2_ws/log
      # X11 socket for host GUI rendering (Gazebo / RViz)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["sleep", "infinity"]

volumes:
  kairos_rl_build:
  kairos_rl_install:
  kairos_rl_log:
